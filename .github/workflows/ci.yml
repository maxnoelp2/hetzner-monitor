name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: No OpenSSL in the dependency tree
        run: "! cargo tree -i openssl-sys --locked 2>/dev/null"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hetzner_monitor
          POSTGRES_PASSWORD: hetzner_monitor
          POSTGRES_DB: hetzner_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hetzner_monitor -d hetzner_monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hetzner_monitor:hetzner_monitor@localhost:5432/hetzner_monitor
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hetzner-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
