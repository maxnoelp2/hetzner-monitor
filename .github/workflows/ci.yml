name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: No OpenSSL in the dependency tree
        run: "! cargo tree -i openssl-sys --locked 2>/dev/null"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hetzner_monitor
          POSTGRES_PASSWORD: hetzner_monitor
          POSTGRES_DB: hetzner_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hetzner_monitor -d hetzner_monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hetzner_monitor:hetzner_monitor@localhost:5432/hetzner_monitor
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --locked
      # The embedded-UI tests need web/dist; without it they skip.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Serve the embedded UI (feature web-ui)
        run: cargo test -p hm-server --features web-ui --locked --test web

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Generate the OpenAPI document
        run: cargo run --locked -q -p hm-server -- openapi > openapi.json
      - name: Lint it (redocly.yaml, .redocly.lint-ignore.yaml)
        run: npx --yes @redocly/cli@2.77.0 lint openapi.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate the web API client from it
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
      - name: The committed web client is current (ADR-0016)
        run: |
          if ! git diff --exit-code web/src/api/schema.d.ts; then
            echo "::error file=web/src/api/schema.d.ts::web/src/api/schema.d.ts is out of date; regenerate with cargo run -q -p hm-server -- openapi > openapi.json && (cd web && npm run gen:api)"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: hetzner-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
