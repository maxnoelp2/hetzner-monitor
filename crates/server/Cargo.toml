[package]
name = "hm-server"
description = "hetzner-monitor: HTTP API, scheduler and CLI (the binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "hm_server"
path = "src/lib.rs"

[[bin]]
name = "hetzner-monitor"
path = "src/main.rs"

[dependencies]
hm-core.workspace = true
hm-hcloud.workspace = true
hm-notify.workspace = true
anyhow.workspace = true
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
time.workspace = true
uuid.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
zeroize.workspace = true
axum.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Embeds web/dist (feature `web-ui`, ADR-0015).
rust-embed = { workspace = true, optional = true }

[features]
# Serve the React PWA from web/dist (build it first: `npm ci && npm run build` in web/).
web-ui = ["dep:rust-embed"]

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
wiremock.workspace = true

[lints]
workspace = true
