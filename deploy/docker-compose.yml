# Self-hosted setup: Postgres + the released hetzner-monitor image (README, "Self-hosting").
#   docker compose up -d                      # in a directory with this file and a .env next to it
# Settings come from .env next to this file (template: deploy/.env.example, reference:
# docs/design/configuration.md). Set HM_POSTGRES_PASSWORD before the first start.
# Development (build from source): add -f deploy/docker-compose.build.yml, see CLAUDE.md.
name: hetzner-monitor

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hetzner_monitor
      POSTGRES_PASSWORD: ${HM_POSTGRES_PASSWORD:-hetzner_monitor}
      POSTGRES_DB: hetzner_monitor
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${HM_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hetzner_monitor -d hetzner_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    # Pinned release; upgrade by changing HM_VERSION (CHANGELOG.md lists what changed).
    image: ghcr.io/maxnoelp2/hetzner-monitor:${HM_VERSION:-0.1.0}
    environment:
      HM_DATABASE_URL: postgres://hetzner_monitor:${HM_POSTGRES_PASSWORD:-hetzner_monitor}@postgres:5432/hetzner_monitor
      # Required — the app refuses to start without it. How to generate one: see deploy/.env.example
      HM_MASTER_KEY: ${HM_MASTER_KEY:-}
      # Instead of HM_MASTER_KEY, for rotation: HM_MASTER_KEYS=1:<old>,2:<new> (docs/design/security.md)
      HM_MASTER_KEYS: ${HM_MASTER_KEYS:-}
      HM_MODE: ${HM_MODE:-all}
      HM_LOG: ${HM_LOG:-info}
      # Notifications (docs/design/configuration.md). Empty = unset: no email channels, no links.
      HM_BASE_URL: ${HM_BASE_URL:-}
      HM_SMTP_HOST: ${HM_SMTP_HOST:-}
      HM_SMTP_PORT: ${HM_SMTP_PORT:-}
      HM_SMTP_TLS: ${HM_SMTP_TLS:-}
      HM_SMTP_USER: ${HM_SMTP_USER:-}
      HM_SMTP_PASSWORD: ${HM_SMTP_PASSWORD:-}
      HM_SMTP_FROM: ${HM_SMTP_FROM:-}
      HM_ALLOW_PRIVATE_TARGETS: ${HM_ALLOW_PRIVATE_TARGETS:-}
    ports:
      - "127.0.0.1:${HM_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
