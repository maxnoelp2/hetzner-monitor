# Local / self-hosted setup: Postgres + hetzner-monitor.
#   docker compose -f deploy/docker-compose.yml up --build
# Copy deploy/.env.example to deploy/.env to override defaults. Change the password for anything non-local.
name: hetzner-monitor

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hetzner_monitor
      POSTGRES_PASSWORD: ${HM_POSTGRES_PASSWORD:-hetzner_monitor}
      POSTGRES_DB: hetzner_monitor
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${HM_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hetzner_monitor -d hetzner_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: hetzner-monitor:dev
    environment:
      HM_DATABASE_URL: postgres://hetzner_monitor:${HM_POSTGRES_PASSWORD:-hetzner_monitor}@postgres:5432/hetzner_monitor
      # Required — the app refuses to start without it. How to generate one: see deploy/.env.example
      HM_MASTER_KEY: ${HM_MASTER_KEY:-}
      HM_MODE: ${HM_MODE:-all}
      HM_LOG: ${HM_LOG:-info}
      # Notifications (docs/design/configuration.md). Empty = unset: no email channels, no links.
      HM_BASE_URL: ${HM_BASE_URL:-}
      HM_SMTP_HOST: ${HM_SMTP_HOST:-}
      HM_SMTP_PORT: ${HM_SMTP_PORT:-}
      HM_SMTP_TLS: ${HM_SMTP_TLS:-}
      HM_SMTP_USER: ${HM_SMTP_USER:-}
      HM_SMTP_PASSWORD: ${HM_SMTP_PASSWORD:-}
      HM_SMTP_FROM: ${HM_SMTP_FROM:-}
      HM_ALLOW_PRIVATE_TARGETS: ${HM_ALLOW_PRIVATE_TARGETS:-}
    ports:
      - "127.0.0.1:${HM_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
